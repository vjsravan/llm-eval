[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmeval"
version = "1.0.0"
description = "Regression testing and merge gating for LLM pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jay Sravan Vadlamudi", email = "jay.sravan.dev@gmail.com" }]
keywords = ["llm", "evaluation", "testing", "ci", "regression", "prompt-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

# No runtime dependencies. An eval gate that drags in a scientific-computing stack is
# an eval gate that gets skipped in CI for being slow to install.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
llmeval = "llmeval.cli:main"

[project.urls]
Homepage = "https://github.com/vjsravan/llm-eval"

[tool.setuptools.packages.find]
include = ["llmeval*"]
