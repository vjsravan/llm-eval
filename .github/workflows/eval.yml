name: Eval gate

# Runs the golden suite on every PR and blocks the merge when output quality drops.
# The baseline is the run committed on main, so "did this prompt change make things
# worse?" is answered automatically instead of by whoever remembers to check.

on:
  pull_request:
    paths:
      - "llmeval/**"
      - "examples/**"
      - "prompts/**"
  push:
    branches: [main]
  workflow_dispatch:

# Required so the publish job can deploy the rendered report to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest report wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  eval-gate:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # The committed baseline is what main currently scores. Regenerate it
      # deliberately (make baseline) when an intentional change moves the numbers.
      # Its absence is a real defect, not a soft condition: without it the statistical
      # half of the gate silently never runs, and a green check would mean less than
      # it appears to.
      - name: Require a committed baseline
        run: |
          if [ ! -f runs/baseline.json ]; then
            echo "::error::runs/baseline.json is missing — run 'make baseline' and commit it."
            exit 1
          fi

      - name: Run eval suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/examples/customs_classification
        run: |
          python -m llmeval.cli run examples/customs_classification/suite.json \
            --model models:baseline_model \
            --label "${GITHUB_SHA::8}" \
            --baseline runs/baseline.json \
            --save runs/candidate.json \
            --require-tag safety=1.0 \
            --require-tag hallucination-guard=1.0 \
            --min-effect 0.02 | tee eval-output.txt

      # The published report is the *demo*: the same suite under a prompt that dropped
      # two guardrails. A report showing a clean pass demonstrates nothing, and the
      # README describes this one — so CI has to be what actually generates it.
      # Exits 1 by design, hence `|| true`; the gate above is what blocks the merge.
      - name: Render the demo regression report
        if: always()
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/examples/customs_classification
        run: |
          python -m llmeval.cli run examples/customs_classification/suite.json \
            --model models:regressed_model \
            --label regressed-demo \
            --baseline runs/baseline.json \
            --save runs/regressed.json \
            --html runs/report.html \
            --require-tag safety=1.0 \
            --require-tag hallucination-guard=1.0 | tee demo-output.txt || true

          if ! grep -q "gate: FAIL" demo-output.txt; then
            echo "::error::The demo prompt dropped two guardrails but the gate passed."
            exit 1
          fi

      - name: Write PR summary
        if: always()
        run: |
          {
            echo "## Eval gate"
            echo ""
            echo '```'
            cat eval-output.txt
            echo '```'
            if [ -f demo-output.txt ]; then
              echo ""
              echo "<details><summary>Demo — the same suite under a regressed prompt</summary>"
              echo ""
              echo '```'
              cat demo-output.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            runs/candidate.json
            runs/regressed.json
            runs/report.html
          retention-days: 30

      # Stage the report as a Pages site. Runs even when the gate fails — a blocked
      # merge is exactly when someone wants to look at the report.
      - name: Stage Pages site
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp runs/report.html _site/index.html
          cp runs/regressed.json _site/run.json
          cp runs/baseline.json _site/baseline.json

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish-report:
    # Only from main, and only once the suite has actually produced a report.
    if: always() && github.ref == 'refs/heads/main'
    needs: eval-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
